apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-website
  labels:
    app: recipe-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recipe-website
  template:
    metadata:
      labels:
        app: recipe-website
    spec:
      containers:
      - name: recipe-website
        image: jasmyn13/recipe-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
